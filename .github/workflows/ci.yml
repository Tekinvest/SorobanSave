name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'LICENSE'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'

jobs:
  # ─── Code Quality & Security Checks ─────────────────────────────────────────
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend - Lint check
        run: pnpm --filter frontend lint

      - name: Frontend - Format check
        run: pnpm --filter frontend exec prettier --check "src/**/*.{ts,tsx,css}"

      - name: Frontend - Security audit
        run: pnpm --filter frontend audit --audit-level=high
        continue-on-error: false

      - name: Backend - Security audit
        run: pnpm --filter backend audit --audit-level=high
        continue-on-error: false

      # ── Rust Quality Checks ──────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust - Format check
        run: cargo fmt --all -- --check

      - name: Rust - Clippy lint
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            -- -D warnings

      - name: Rust - Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Frontend Tests & Coverage ──────────────────────────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Run tests with coverage
        run: pnpm --filter frontend test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Shared Utils Tests & Coverage ──────────────────────────────────
  shared-utils:
    name: Shared Utils Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @soroban-save/shared-utils lint

      - name: Run tests with coverage
        run: pnpm --filter @soroban-save/shared-utils test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-utils-coverage
          path: packages/shared-utils/coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/shared-utils/coverage/lcov.info
          flags: shared-utils
          name: shared-utils-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Rust Contract Tests & Coverage ──────────────────────────────────
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run contract tests with coverage
        run: |
          cargo llvm-cov \
            --manifest-path contracts/soroban-save/Cargo.toml \
            --lcov \
            --output-path lcov.info \
            -- --test-threads=1

      - name: Check coverage threshold (85%)
        run: |
          cargo llvm-cov \
            --manifest-path contracts/soroban-save/Cargo.toml \
            --summary-only \
            -- --test-threads=1 2>&1 | tee coverage_summary.txt

          python3 -c "
          import re, sys
          text = open('coverage_summary.txt').read()
          m = re.search(r'Lines\s+([\d.]+)%', text)
          cov = float(m.group(1)) if m else 0.0
          print(f'Line coverage: {cov:.1f}%')
          if cov < 85.0:
              print(f'ERROR: Coverage {cov:.1f}% is below the 85% threshold')
              sys.exit(1)
          print(f'OK: Coverage {cov:.1f}% meets the 85% threshold')
          "

      - name: Generate HTML coverage report
        run: |
          cargo llvm-cov \
            --manifest-path contracts/soroban-save/Cargo.toml \
            --html \
            --output-dir coverage-html \
            -- --test-threads=1

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: coverage-html/
          retention-days: 30

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: contracts
          name: rust-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Build Verification ──────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality, frontend, contracts]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Soroban contract
        run: |
          cargo build \
            --manifest-path contracts/soroban-save/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

  # ─── Deploy to Testnet (develop branch only) ──────────────────────
  deploy-testnet:
    name: Deploy to Testnet
    needs: [build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          cargo install stellar-cli --locked 2>/dev/null || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure deployer identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET_KEY }}
        run: stellar keys add default --secret-key "$STELLAR_SECRET_KEY"

      - name: Deploy contracts to testnet
        env:
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
        run: ./scripts/deploy_testnet.sh

      - name: Run smoke tests
        run: ./scripts/smoke_test.sh

  # ─── Deploy to Mainnet (main branch only) ─────────────────────────
  deploy-mainnet:
    name: Deploy to Mainnet
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          cargo install stellar-cli --locked 2>/dev/null || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure deployer identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET_KEY }}
        run: stellar keys add default --secret-key "$STELLAR_SECRET_KEY"

      - name: Deploy contracts to mainnet
        env:
          AUTO_CONFIRM_MAINNET: "true"
          STELLAR_NETWORK: mainnet
          STELLAR_RPC_URL: https://soroban-rpc.mainnet.stellar.gateway.fm
        run: ./scripts/deploy_mainnet.sh

      - name: Run smoke tests
        run: ./scripts/smoke_test.sh
