name: Mutation Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'contracts/**'

jobs:
  mutation-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation testing
        working-directory: ./contracts/soroban-save
        run: |
          cargo mutants \
            --file soroban_save \
            --output ../mutants-out \
            --jobs 2

      - name: Check mutation score
        working-directory: ./contracts
        run: |
          SURVIVED=$(find mutants-out -name "*.log" -path "*/missed/*" 2>/dev/null | wc -l)
          TOTAL=$(find mutants-out -name "*.log" 2>/dev/null | wc -l)

          if [ "$TOTAL" -eq 0 ]; then
            echo "No mutants generated — skipping score check"
            exit 0
          fi

          CAUGHT=$((TOTAL - SURVIVED))
          SCORE=$(awk "BEGIN {printf \"%.1f\", ($CAUGHT/$TOTAL)*100}")
          echo "Mutation score: ${SCORE}% (${CAUGHT}/${TOTAL} caught)"

          if awk "BEGIN {exit ($SCORE >= 75) ? 0 : 1}"; then
            echo "✅ Mutation score passed: ${SCORE}%"
          else
            echo "❌ Mutation score below 75% threshold: ${SCORE}%"
            exit 1
          fi

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: contracts/mutants-out/
          retention-days: 14
