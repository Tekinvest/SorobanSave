[default]
# Run on native target; wasm32 is not supported by tarpaulin
target-dir = "target"
workspace = true
features = ["testutils"]
out = ["Html", "Xml"]
output-dir = "coverage"
# Aligned with codecov.yml gate (contracts: 90%)
fail-under = 85
timeout = "120s"
# Exclude test helpers and generated code from coverage measurement
exclude-files = [
  "*/tests/*",
  "*/test_snapshots/*",
  "*/frontend/*",
  "*/backend/*",
]
