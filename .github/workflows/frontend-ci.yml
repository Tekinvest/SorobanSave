name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm --filter frontend audit --audit-level=high

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Type check
        run: pnpm --filter frontend typecheck

      - name: Test with coverage
        run: pnpm --filter frontend test:coverage

      - name: Update snapshots (on snapshot-update branch)
        if: github.head_ref == 'snapshot-update'
        run: pnpm --filter frontend exec vitest run --update-snapshots

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots
          path: frontend/src/test/__snapshots__/
          if-no-files-found: ignore
