name: Contract CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

jobs:
  contract-ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.81.0'
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust toolchain and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit contract dependencies
        run: cargo audit --file Cargo.lock

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check contract WASM sizes
        id: size_check
        run: |
          LIMIT=$((60 * 1024))
          FAILED=0
          REPORT=""

          for WASM in target/wasm32-unknown-unknown/release/*.wasm; do
            NAME=$(basename "$WASM")
            SIZE=$(wc -c < "$WASM")
            PCT=$(awk "BEGIN {printf \"%.1f\", ($SIZE/$LIMIT)*100}")
            STATUS="✅"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              STATUS="❌"
              FAILED=1
              echo "ERROR: $NAME size ${SIZE} bytes exceeds 60KB limit"
            fi
            echo "$NAME: ${SIZE} bytes (${PCT}% of limit) $STATUS"
            REPORT="${REPORT}| \`${NAME}\` | ${SIZE} | ${PCT}% | ${STATUS} |\n"
          done

          printf "report<<EOF\n%b\nEOF\n" "$REPORT" >> "$GITHUB_OUTPUT"
          exit $FAILED

      - name: Post contract sizes as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.size_check.outputs.report }}`;
            const limit = 60 * 1024;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Contract Size Report\n\n| Contract | Size (bytes) | % of limit | Status |\n|----------|-------------|------------|--------|\n${report}\n\n_Limit: ${limit} bytes (60 KB)_`
            });
